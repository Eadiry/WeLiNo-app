# WeLiNo — iOS TestFlight pipeline for the LNReader v2 fork.
#
# LNReader ships only Android CI; this builds the (renamed) app for iOS.
# Flow: pnpm install → generate build-info → `expo prebuild --platform ios`
# (creates ios/ from app.json) → bundle exec pod install → sign → IPA →
# App Store Connect (upload only; add to the Internal Testing group by hand).
#
# Reuses the signing identities already created for the Capacitor WeLiNo:
#   - App Store Connect API key integration  "WelinoAppStoreConnect"
#   - distribution cert                      "WeLiNo Distribution"
#   - App Store provisioning profile         "WeLiNo AppStore Profile"
# all for bundle id com.welino.reader.
#
# Speed: ccache carries the compiled C/C++ pod objects (Reanimated, RNScreens,
# nitro-*, op-sqlite, MMKV, folly…) between builds — that's most of the archive
# time. The pnpm store + the pinned Ruby gems are cached too. We deliberately
# DON'T cache node_modules / ios/Pods / the CocoaPods spec repo: they're big
# many-small-file trees that Codemagic's post-build "cleaning up" step spends
# longer tarring + uploading than they ever save. `pnpm install` rehydrates
# node_modules from the store in seconds; `pod install` pulls from the CDN.

workflows:
  ios-testflight:
    name: WeLiNo iOS — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WelinoAppStoreConnect
    environment:
      ios_signing:
        provisioning_profiles:
          - WeLiNo AppStore Profile
        certificates:
          - WeLiNo Distribution
      vars:
        # Numeric Apple ID of the com.welino.reader app (App Store Connect →
        # App Information). Same app as the Capacitor build.
        APP_STORE_APPLE_ID: '6807081263'
        BUNDLE_ID: 'com.welino.reader'
        EXPO_NO_TELEMETRY: '1'
        CI: 'true'
        # Route the RN/Expo native build through ccache.
        USE_CCACHE: '1'
        CCACHE_DIR: $HOME/Library/Caches/ccache
      node: 22
      xcode: latest
      cocoapods: default
    cache:
      # Keep this list SHORT. Codemagic packs + uploads every path here in the
      # post-build "cleaning up" step; many-small-file trees (node_modules,
      # ios/Pods, ~/.cocoapods/repos) cost more to pack than they save.
      cache_paths:
        # Compiled C/C++ pod objects — the real archive-time lever.
        - $HOME/Library/Caches/ccache
        # Content-addressed + deduped; `pnpm install` rehydrates node_modules
        # from it in seconds.
        - $HOME/Library/pnpm/store
        # The pinned cocoapods/xcodeproj gems (small, stable).
        - $CM_BUILD_DIR/vendor/bundle
        # Prebuilt sherpa-onnx xcframework (ONNX Runtime baked in) for the
        # on-device Kokoro TTS engine — large + stable: a good cache fit. The
        # fetch script re-downloads if the cached copy is from a different
        # release asset, so a stale cache self-heals.
        - $CM_BUILD_DIR/modules/nitro-tts/ios/vendor
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: welino
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Enable pnpm (Corepack)
        script: |
          corepack enable
          corepack prepare pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]") --activate
          pnpm config set store-dir "$HOME/Library/pnpm/store"
          pnpm --version

      - name: Install JS dependencies
        script: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate build-info (@env)
        script: |
          # Writes src/generated/build-info.ts, which the `@env` babel alias
          # resolves to. Tracker client IDs are optional — leave them unset.
          pnpm generate:env:release \
            --build-type "Codemagic" \
            --node-env "production"

      - name: Inline the WebView reader assets (iOS)
        script: |
          # LNReader loads assets/reader/{css,js} from file:///android_asset at
          # runtime — Android-only. Regenerate the inlined TS module so the
          # reader works on iOS (committed too; this keeps it in sync).
          pnpm generate:reader-assets

      - name: Vendor sherpa-onnx (on-device Kokoro TTS)
        script: |
          # Downloads the prebuilt SherpaOnnxC.xcframework into
          # modules/nitro-tts/ios/vendor/ (cached). If it fails, the build still
          # succeeds — KokoroSpeechEngine.swift compiles as a no-op and the app
          # ships with Kokoro unavailable. Output is teed to an artifact because
          # this pre-build step is otherwise invisible outside the Codemagic UI.
          node scripts/fetch-sherpa-onnx.cjs 2>&1 | tee "$CM_BUILD_DIR/sherpa-vendor.log" || true
          echo "--- modules/nitro-tts/ios/vendor ---" | tee -a "$CM_BUILD_DIR/sherpa-vendor.log"
          ls -la modules/nitro-tts/ios/vendor 2>&1 | tee -a "$CM_BUILD_DIR/sherpa-vendor.log" || true
          find modules/nitro-tts/ios/vendor -maxdepth 4 2>&1 | tee -a "$CM_BUILD_DIR/sherpa-vendor.log" || true

      - name: Prepare ccache
        script: |
          brew list ccache >/dev/null 2>&1 || brew install ccache
          mkdir -p "$CCACHE_DIR"
          # Compressed + a modest cap so the cache dir stays small enough to
          # pack quickly in "cleaning up". A full RN/Expo iOS ccache is ~1–2 G.
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          ccache --zero-stats || true

      - name: Prebuild iOS project
        script: |
          # `--non-interactive` isn't supported; CI=1 (set in env) covers it.
          npx expo prebuild --platform ios --no-install
          echo "--- generated iOS project ---"
          ls -la ios

      - name: Install CocoaPods (honouring the root Gemfile pins)
        script: |
          # LNReader pins cocoapods/xcodeproj versions in the repo-root Gemfile
          # specifically to dodge known build breaks — use bundler, not the
          # image default. Gems are cached; pods download from the CDN.
          bundle config set --local path "vendor/bundle"
          bundle install --jobs 4
          cd ios
          bundle exec pod install 2>&1 | tee "$CM_BUILD_DIR/pod-install.log"
          # Did the SherpaOnnxC link flags actually reach the xcconfigs?
          {
            echo "=== NitroTts.release.xcconfig ==="
            cat "Pods/Target Support Files/NitroTts/NitroTts.release.xcconfig" 2>&1
            echo "=== Pods-WeLiNo.release.xcconfig (Sherpa lines) ==="
            grep -n -i sherpa "Pods/Target Support Files/Pods-WeLiNo/Pods-WeLiNo.release.xcconfig" 2>&1
            echo "=== project.pbxproj Sherpa refs ==="
            grep -c -i sherpa Pods/Pods.xcodeproj/project.pbxproj 2>&1
          } | tee -a "$CM_BUILD_DIR/pod-install.log"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number from the last TestFlight build
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA
        script: |
          set -e
          # The .xcworkspace only exists after `pod install`, so discover it
          # here rather than in the prebuild step.
          WS=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WS" ]; then
            echo "No .xcworkspace under ios/ — contents:"; ls -la ios; exit 1
          fi
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS  scheme=$SCHEME"
          xcode-project build-ipa --workspace "$WS" --scheme "$SCHEME"
          ccache --show-stats || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/Podfile.lock
      - sherpa-vendor.log
      - pod-install.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testing (own device) needs no beta review —
        # add the processed build to the Internal Testing group by hand.
        submit_to_testflight: false
