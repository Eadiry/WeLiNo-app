# WeLiNo — iOS TestFlight pipeline for the LNReader v2 fork.
#
# LNReader ships only Android CI; this builds the (renamed) app for iOS.
# Flow: pnpm install → generate build-info → `expo prebuild --platform ios`
# (creates ios/ from app.json) → bundle exec pod install → sign → IPA →
# App Store Connect (upload only; add to the Internal Testing group by hand).
#
# Reuses the signing identities already created for the Capacitor WeLiNo:
#   - App Store Connect API key integration  "WelinoAppStoreConnect"
#   - distribution cert                      "WeLiNo Distribution"
#   - App Store provisioning profile         "WeLiNo AppStore Profile"
# all for bundle id com.welino.reader.

workflows:
  ios-testflight:
    name: WeLiNo iOS — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WelinoAppStoreConnect
    environment:
      ios_signing:
        provisioning_profiles:
          - WeLiNo AppStore Profile
        certificates:
          - WeLiNo Distribution
      vars:
        # Numeric Apple ID of the com.welino.reader app (App Store Connect →
        # App Information). Same app as the Capacitor build.
        APP_STORE_APPLE_ID: '6807081263'
        BUNDLE_ID: 'com.welino.reader'
        EXPO_NO_TELEMETRY: '1'
        CI: 'true'
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: welino
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Enable pnpm (Corepack)
        script: |
          corepack enable
          corepack prepare pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]") --activate
          pnpm --version

      - name: Install JS dependencies
        script: pnpm install --frozen-lockfile

      - name: Generate build-info (@env)
        script: |
          # Writes src/generated/build-info.ts, which the `@env` babel alias
          # resolves to. Tracker client IDs are optional — leave them unset.
          pnpm generate:env:release \
            --build-type "Codemagic" \
            --node-env "production"

      - name: Prebuild iOS project
        script: |
          # `--non-interactive` isn't supported; CI=1 (set in env) covers it.
          npx expo prebuild --platform ios --clean --no-install
          echo "--- generated iOS project ---"
          ls -la ios

      - name: Install CocoaPods (honouring the root Gemfile pins)
        script: |
          # LNReader pins cocoapods/xcodeproj versions in the repo-root Gemfile
          # specifically to dodge known build breaks — use bundler, not the
          # image default.
          bundle install
          cd ios
          bundle exec pod install

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number from the last TestFlight build
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA
        script: |
          set -e
          # The .xcworkspace only exists after `pod install`, so discover it
          # here rather than in the prebuild step.
          WS=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WS" ]; then
            echo "No .xcworkspace under ios/ — contents:"; ls -la ios; exit 1
          fi
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS  scheme=$SCHEME"
          xcodebuild -workspace "$WS" -list || true
          xcode-project build-ipa --workspace "$WS" --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/Podfile.lock

    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testing (own device) needs no beta review —
        # add the processed build to the Internal Testing group by hand.
        submit_to_testflight: false
